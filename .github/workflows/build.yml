name: build

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - q2pro_race
      - dev

env:
  MESON_ARGS: >-
    --auto-features=enabled
    --fatal-meson-warnings
    -Danticheat-server=true
    -Davcodec=disabled
    -Dclient-gtv=true
    -Dpacketdup-hack=true
    -Dvariable-fps=true


  MESON_ARGS_WIN: >-
    -Dsdl2=disabled
    -Dwayland=disabled
    -Dwrap_mode=forcefallback
    -Dx11=disabled

  MESON_ARGS_MACOS: >-
    -Dicmp-errors=disabled
    -Dwayland=disabled
    -Dwindows-crash-dumps=disabled
    -Dwrap_mode=nofallback
    -Dx11=disabled
    -Dsystem-wide=false

jobs:
  strafe-efficiency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zlib1g-dev
          pip3 install --no-input meson ninja

      - name: Configure jump and HUD unit tests
        run: |
          meson setup --auto-features=disabled --wrap-mode=nodownload \
            -Dsystem-wide=false -Db_ndebug=true -Dzlib=enabled builddir-strafe

      - name: Build and run standalone tests
        run: |
          meson test -C builddir-strafe --suite jump-hud --suite video --suite console --suite network --print-errorlogs

      - name: Check network fixtures without compression
        run: |
          meson setup --auto-features=disabled --wrap-mode=nodownload \
            -Dsystem-wide=false -Db_ndebug=true -Dzlib=disabled builddir-no-zlib
          meson test -C builddir-no-zlib --suite network --print-errorlogs

  linux-client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ui: ['true', 'false']
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev zlib1g-dev
          pip3 install --no-input meson ninja

      - name: Configure
        run: |
          meson setup --auto-features=disabled --wrap-mode=nodownload \
            --buildtype=release -Db_ndebug=true -Dsystem-wide=false -Dtests=false \
            -Dsdl2=enabled -Dsoftware-sound=enabled -Dzlib=enabled \
            -Dclient-ui=${{ matrix.ui }} builddir-linux

      - name: Build client and game library
        run: meson compile -C builddir-linux

      - name: Run standalone tests
        run: meson test -C builddir-linux --suite jump-hud --suite video --suite console --suite network --print-errorlogs

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: ["x64", "x86"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - uses: actions/cache@v6
        with:
          path: subprojects/packagecache
          key: ${{ hashFiles('subprojects/*.wrap') }}

      - name: Configure MSVC
        shell: pwsh
        run: |
          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vsPath) {
            throw 'Visual Studio with the MSVC x86/x64 tools was not found.'
          }
          & (Join-Path $vsPath 'Common7/Tools/Launch-VsDevShell.ps1') -Arch ${{ matrix.arch }} -HostArch amd64 -SkipAutomaticLocation
          Get-ChildItem Env: | Where-Object { $before[$_.Name] -cne $_.Value } | ForEach-Object {
            "$($_.Name)=$($_.Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Install NASM
        run: |
          choco install nasm -y --no-progress
          $nasmPath = Join-Path $env:ProgramFiles "NASM"
          if (Test-Path (Join-Path $nasmPath "nasm.exe")) {
            Add-Content $env:GITHUB_PATH $nasmPath
            & (Join-Path $nasmPath "nasm.exe") -v
          } else {
            nasm -v
          }

      - name: Install dependencies
        run: pip3 install --no-input meson ninja

      - name: Configure
        run: meson setup ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_WIN }} builddir-${{ matrix.arch }} --buildtype=release -Db_ndebug=true

      - name: Build
        run: meson compile -C builddir-${{ matrix.arch }}

      - name: Run standalone tests
        run: meson test -C builddir-${{ matrix.arch }} --suite jump-hud --suite video --suite console --suite network --print-errorlogs

      - name: Build and test without client menus
        run: |
          meson setup --auto-features=disabled --wrap-mode=nodownload --buildtype=release -Db_ndebug=true -Dsystem-wide=false -Dtests=false -Dclient-ui=false -Dwindows-egl=true -Dsoftware-sound=enabled -Dzlib=enabled builddir-no-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          meson compile -C builddir-no-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          meson test -C builddir-no-ui --suite jump-hud --suite console --suite network --print-errorlogs

      - name: Collect artifacts
        run: |
          mkdir artifacts
          mkdir artifacts/jump
          mkdir artifacts/jump/pics
          mkdir artifacts/jump/players
          mkdir artifacts/jump/players/female
          cp builddir-${{ matrix.arch }}/q2pro_race.exe artifacts/
          cp jump/pics/prochars.png artifacts/jump/pics/
          cp jump/pics/conback.png artifacts/jump/pics/
          cp jump/pics/q2jump_background.png artifacts/jump/pics/
          cp jump/players/female/ctf_b.pcx artifacts/jump/players/female/
          cp jump/players/female/ctf_b.png artifacts/jump/players/female/
          cp jump/players/female/ctf_b_i.pcx artifacts/jump/players/female/
          cp jump/players/female/ctf_r.pcx artifacts/jump/players/female/
          cp jump/players/female/ctf_r.png artifacts/jump/players/female/
          cp jump/players/female/ctf_r_i.pcx artifacts/jump/players/female/

      - name: Set version env
        run: |
          $ver = (python version.py).Split('~')[0]
          Add-Content $env:GITHUB_ENV "VERSION=$ver"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          retention-days: 2
          name: q2pro_race-windows-${{ matrix.arch }}-${{ env.VERSION }}
          path: artifacts

  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            brew-prefix: /opt/homebrew
          - arch: x86_64
            runner: macos-15-intel
            brew-prefix: /usr/local
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Install dependencies
        shell: bash
        run: |
          arch -${{ matrix.arch }} /bin/bash -e -o pipefail <<'BUILD'
          export PATH="${{ matrix.brew-prefix }}/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          brew update
          brew install meson ninja sdl2 openal-soft libpng jpeg-turbo zlib curl pkg-config
          BUILD

      - name: Configure
        shell: bash
        run: |
          arch -${{ matrix.arch }} /bin/bash -e -o pipefail <<'BUILD'
          export PATH="${{ matrix.brew-prefix }}/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          openal_prefix="$(brew --prefix openal-soft)"
          export CC=clang
          export CFLAGS="--include stdbool.h --include stddef.h -I$openal_prefix/include -I$openal_prefix/include/AL"
          export PKG_CONFIG_LIBDIR="$(brew --prefix)/lib/pkgconfig:$openal_prefix/lib/pkgconfig:$(brew --prefix jpeg-turbo)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig"
          export PKG_CONFIG_PATH="$PKG_CONFIG_LIBDIR"
          meson setup ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_MACOS }} \
            builddir-${{ matrix.arch }} --buildtype=release -Db_ndebug=true
          BUILD

      - name: Build
        shell: bash
        run: |
          arch -${{ matrix.arch }} /bin/bash -e -o pipefail <<'BUILD'
          export PATH="${{ matrix.brew-prefix }}/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          meson compile -C builddir-${{ matrix.arch }}
          BUILD

      - name: Run standalone tests
        shell: bash
        run: |
          arch -${{ matrix.arch }} /bin/bash -e -o pipefail <<'BUILD'
          export PATH="${{ matrix.brew-prefix }}/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          meson test -C builddir-${{ matrix.arch }} --suite jump-hud --suite video --suite console --suite network --print-errorlogs
          BUILD

      - name: Verify and package macOS artifacts
        run: |
          builddir="builddir-${{ matrix.arch }}"
          test -x "$builddir/q2pro_race"
          lipo "$builddir/q2pro_race" -verify_arch ${{ matrix.arch }}
          lipo "$builddir/game${{ matrix.arch }}.dylib" -verify_arch ${{ matrix.arch }}
          otool -L "$builddir/q2pro_race"
          mkdir -p artifacts q2pro_race/baseq2 q2pro_race/jump/pics q2pro_race/jump/players/female
          cp "$builddir/q2pro_race" q2pro_race/
          cp "$builddir/game${{ matrix.arch }}.dylib" q2pro_race/baseq2/
          cp jump/pics/prochars.png jump/pics/conback.png jump/pics/q2jump_background.png q2pro_race/jump/pics/
          cp jump/players/female/ctf_{b,r}{.pcx,.png,_i.pcx} q2pro_race/jump/players/female/
          zip -r "artifacts/q2pro_race-darwin-${{ matrix.arch }}.zip" q2pro_race

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          retention-days: 2
          name: q2pro_race-darwin-${{ matrix.arch }}
          path: artifacts/*.zip
          if-no-files-found: error

  release:
    if: >-
      ${{ github.event_name == 'push' &&
          (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/q2pro_race') }}
    needs: [windows, macos, strafe-efficiency, linux-client]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: q2pro_race-*
          path: artifacts

      - name: Compress release artifacts
        run: |
          for dir in artifacts/q2pro_race-windows-*; do
            if [ -d "$dir" ]; then
              (cd "$dir" && zip -r "../$(basename "$dir").zip" .)
            fi
          done
          # macOS ZIPs are created on macOS to retain executable permissions.
          cp artifacts/q2pro_race-darwin-*/*.zip artifacts/

      - name: Create or update "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest --json name --jq .name >/dev/null 2>&1; then
            echo "Updating 'latest' release"
            gh release edit latest -t "Latest" -n "Automatically updated latest build" --latest
            gh release upload latest ./artifacts/*.zip --clobber
          else
            echo "Creating latest release"
            gh release create latest ./artifacts/*.zip --title "Latest" --notes "Automatically updated latest build"
          fi
      - name: Update tag
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "tags/latest",
              sha: context.sha,
              force: true
            })
